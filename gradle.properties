VERSION_NAME=1.3
VERSION_CODE=4
GROUP=cn.pedant.sweetalert

# Global memory-optimized settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxGCPauseMillis=500

android.enableJetifier=true
android.useAndroidX=true
