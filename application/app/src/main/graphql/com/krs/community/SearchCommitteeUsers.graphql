query SearchCommitteeUsers($input: SearchCommitteeUsersInput!) {
  searchCommitteeUsers(input: $input) {
    success
    message
    total_records
    members {
      id
      first_name
      member_code
      committee
      committee_id
      designation
      designation_id
      sub_community
      sub_community_id
      local_community
      local_community_id
    }
  }
}
