query GetInactiveUsers($input: GetInactiveUsersInput!) {
    getInactiveUsers(input: $input) {
        success
        message
        total_records
        members {
            id
            head_id
            first_name
            last_name_id
            mobile
            email
            status
            sub_community_id
            local_community_id
            member_count
            userAddress {
                address
                area
                city_id
                states_id
            }
        }
    }
}
