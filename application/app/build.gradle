apply plugin: 'com.android.application'
//apply plugin: 'io.fabric'
apply plugin: 'realm-android'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}
android {
    compileSdkVersion 27
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.krs.vastipatrak"
        minSdkVersion 21
        versionCode 5
        versionName "1.5.0"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

    }
    /*aaptOptions {
        cruncherEnabled = false
    }
*/
    /*splits {

        abi {
            enable true
            reset()
            include "mips64", "mips","x86","armeabi", "armeabi-v7a"
            universalApk false
        }
    }
    project.ext.versionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'mips': 5, 'mips64': 6, 'x86': 8, 'x86_64': 9]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(
                            com.android.build.OutputFile.ABI), 0) * 10000000 + android.defaultConfig.versionCode
        }
    }*/
}

repositories {
    repositories {
        google()
        jcenter()
    }
    maven {
        url "https://jitpack.io"
    }
    maven { url 'https://maven.fabric.io/public' }
}

ext {
    supportLibraryVersion = '26.1.1'
    // playServicesVersion = '15.0.+'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/OvteBase64.jar')
    implementation 'com.github.recruit-lifestyle:WaveSwipeRefreshLayout:1.6'

    implementation "com.android.support:design:27.0.2"
    //noinspection GradleCompatible
    implementation "com.android.support:multidex:1.0.3"
    /* implementation 'com.github.barteksc:android-pdf-viewer:2.0.3'
*/
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.journeyapps:zxing-android-embedded:3.4.0'
    implementation "com.google.android.gms:play-services-location:15.0.1"
    implementation "com.google.firebase:firebase-messaging:17.1.0"
/*
    implementation 'com.google.android.gms:play-services-ads:15.0.1'
*/
    implementation 'com.mcxiaoke.volley:library-aar:1.0.1'
    implementation 'com.melnykov:floatingactionbutton:1.3.0'
    implementation 'com.weiwangcn.betterspinner:library-material:1.1.0'
    implementation 'com.wdullaer:materialdatetimepicker:3.5.1'
    implementation 'com.github.bumptech.glide:glide:4.6.1'
    implementation files('libs/jxl.jar')
    implementation files('libs/YouTubeAndroidPlayerApi.jar')
    implementation('com.crashlytics.sdk.android:crashlytics:2.9.5@aar') {
        transitive = true
    }
    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.0.0'
    implementation 'com.github.orangegangsters:swipy:1.2.3@aar'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    compile project(':library')
}
apply plugin: 'com.google.gms.google-services'
