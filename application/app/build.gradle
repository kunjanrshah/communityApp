apply plugin: 'com.android.application'
apply plugin: 'io.fabric'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

repositories {
    maven { url 'https://maven.fabric.io/public' }
    mavenCentral()
}
android {
    compileSdkVersion 28
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId "com.krs.community"
        minSdkVersion 21
        versionCode 19
        versionName "1.19.0"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main { res.srcDirs = ['src/main/res', 'src/main/res/values-gu', 'src/main/res/values-hi'] }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    compileOptions {
        targetCompatibility '1.8'
        sourceCompatibility '1.8'
    }
    dataBinding{
        enabled = true
    }
    androidExtensions {
        experimental = true
    }
}

repositories {
    repositories {
        google()
        jcenter()
    }
    maven {
        url "https://jitpack.io"
    }
    maven { url 'https://maven.fabric.io/public' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/OvteBase64.jar')
    implementation 'com.github.recruit-lifestyle:WaveSwipeRefreshLayout:1.6'

    //noinspection GradleCompatible
    implementation('com.crashlytics.sdk.android:crashlytics:2.7.1@aar') {
        transitive = true
    }

    implementation ('com.github.florent37:androidparallax:1.0.1@aar'){
        transitive=true
    }

    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.journeyapps:zxing-android-embedded:3.4.0'

    implementation 'com.google.firebase:firebase-core:16.0.9'
    implementation 'com.google.firebase:firebase-messaging:18.0.0'
    implementation 'com.google.firebase:firebase-auth:17.0.0'
    implementation 'com.google.android.gms:play-services-auth:16.0.1'
    implementation 'com.google.android.gms:play-services-location:16.0.0'

    implementation 'com.mcxiaoke.volley:library-aar:1.0.1'
    implementation 'com.melnykov:floatingactionbutton:1.3.0'
    implementation 'com.weiwangcn.betterspinner:library-material:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.7.1'
    implementation 'com.github.smarteist:autoimageslider:1.2.0'


    implementation files('libs/jxl.jar')
    implementation files('libs/YouTubeAndroidPlayerApi.jar')
    implementation('com.crashlytics.sdk.android:crashlytics:2.9.5@aar') {
        transitive = true
    }

    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.0.0'
    implementation 'com.github.orangegangsters:swipy:1.2.3@aar'
    implementation 'de.blox:graphview:0.4.2'
    implementation project(':multisearchviewlib')
    implementation project(':slycalendarview')
    implementation project(':multiple-images-selector')

    implementation 'com.theartofdev.edmodo:android-image-cropper:2.7.0'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    implementation 'com.wdullaer:materialdatetimepicker:3.5.1'
    implementation 'com.facebook.android:facebook-login:4.42.0'
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    implementation 'com.crystal:crystalrangeseekbar:1.1.3'
    implementation 'com.orhanobut:dialogplus:1.11@aar'
    implementation 'com.github.armcha:SpaceNavigationView:1.6.0'
    implementation 'com.google.android:flexbox:1.1.0'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.chauthai.swipereveallayout:swipe-reveal-layout:1.4.1'
    implementation 'com.facebook.shimmer:shimmer:0.1.0@aar'

    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation "androidx.core:core-ktx:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation 'com.nightonke:boommenu:2.1.1'

    // Fresco
    implementation "com.facebook.fresco:fresco:1.11.0"
    // For animated GIF support
    implementation "com.facebook.fresco:animated-gif:$rootProject.FRESCO_VERSION"
    // For WebP support, including animated WebP
    implementation "com.facebook.fresco:webpsupport:$rootProject.FRESCO_VERSION"
    implementation "com.facebook.fresco:animated-webp:$rootProject.FRESCO_VERSION"

}
apply plugin: 'com.google.gms.google-services'
